[nightlight]
enabled = true
temperature_night = 2000

[notification]
layer = "overlay"
show_actions = false

[osd]
background_opacity = 0.99999997764825821

[plugins]
enabled = [ "noctalia/timer", "nightwatch75/file-search", "oldirtty/color_picker" ]

[shell]
clipboard_auto_paste = "ctrl_v"
clipboard_history_max_entries = 1000
lang = "en"
password_style = "random"
polkit_agent = true
screen_time_enabled = true
time_format = "{:%H:%M:%S}"

    [shell.animation]
    speed = 3.0000000447034836

    [shell.launcher]
    session_search = true

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    open_near_click_launcher = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "solid"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screenshot]
    confirm_region = true
    directory = "/home/leonne/Pictures/Screenshots"

[system.monitor]
cpu_poll_seconds = 1
gpu_poll_seconds = 1
memory_poll_seconds = 1
network_poll_seconds = 1

[templates]

[theme]
builtin = "Tokyo-Night"
community_palette = "Oxocarbon"
wallpaper_scheme = "m3-content"

[wallpaper]
transition = [ "honeycomb" ]

    [wallpaper.default]
    path = "/home/leonne/Pictures/Wallpapers/wallpaper.png"

    [wallpaper.last]
    path = "/home/leonne/Pictures/Wallpapers/wallpaper.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/leonne/Pictures/Wallpapers/wallpaper.png"

[weather]
refresh_minutes = 15

[widget.CPU]
display = "text"
type = "sysmon"

[widget.DISK]
display = "text"
path = "/nix/store/"
stat = "disk_pct"
type = "sysmon"

[widget.SWAP]
display = "text"
glyph = "switch-3"
stat = "swap_pct"
type = "sysmon"

[widget.active_window]
icon_size = 18
max_length = 250
title_scroll = "always"

[widget.bar]
type = "noctalia/timer:bar"

[widget.clock]
capsule = true
format = "{:%d / %m} - {:%H:%M:%S}"

[widget.file-search]
type = "nightwatch75/file-search:file-search"

[widget.lock_keys]
hide_when_off = false
show_scroll_lock = true

[widget.media]
album_art_only = true
art_size = 20

[widget.network]
show_label = false

[widget.notes]
type = "noctalia/notes:notes"

[widget.ram]
display = "text"
stat = "ram_pct"

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
enabled = false
type = "spacer"

[widget.sysmon]
display = "text"

[widget.temp]
display = "text"

[widget.tray]
detached_panel = true
drawer = true
drawer_columns = 5
match_adjacent_spacing = true

[widget.weather]
show_condition = false

[widget.widget]
type = "oldirtty/color_picker:widget"

[widget.workspaces]
empty_color = "tertiary"
focused_output_only = true
hide_when_empty = true
