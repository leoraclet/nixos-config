[dock]
active_monitor_only = true
auto_hide = true
cross_axis_padding = 0
enabled = true
icon_size = 40
inactive_opacity = 0.99999997764825821
item_spacing = 0
magnification_scale = 1.2500000037252903
main_axis_padding = 0
position = "right"
reserve_space = false
show_dots = true

[hot_corners]
enabled = true

    [hot_corners.bottom_left]
    action = "none"

    [hot_corners.bottom_right]
    action = "none"

    [hot_corners.top_left]
    action = "none"

    [hot_corners.top_right]
    action = "none"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

