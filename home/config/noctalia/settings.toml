[audio]
enable_overdrive = true
enable_sounds = true
sound_volume = 0.74999998323619366

[bar.default]
border = "on_surface"
capsule = true
capsule_thickness = 0.64999998919665813
center = [ "workspaces", "widget", "file-search", "bar" ]
end = [ "tray", "media", "group:g4", "group:g6", "group:g3", "group:g2" ]
font_weight = 400
layer = "top"
margin_edge = 0
margin_ends = 0
padding = 0
panel_overlap = 0
radius = 0
shadow = false
show_on_workspace_switch = false
start = [ "group:g5", "clock", "group:g1", "active_window" ]
thickness = 28

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "CPU", "temp", "ram", "SWAP", "DISK" ]
    opacity = 1.0
    padding = 4.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "caffeine", "notes", "settings", "control-center" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "weather", "volume", "input_volume", "brightness", "battery" ]
    opacity = 1.0
    padding = 4.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "notifications", "nightlight", "clipboard" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g5"
    members = [ "lock_keys" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g6"
    members = [ "keyboard_layout", "network", "bluetooth" ]
    opacity = 1.0
    padding = 6.0

[battery]
warning_threshold = 20

[calendar]
enabled = true
refresh_minutes = 5

